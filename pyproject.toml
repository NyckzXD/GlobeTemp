[project]
name = "globetemp"
version = "0.3.0"
description = "Globo 3D com o mapa de calor da temperatura global (Open-Meteo)."
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
testpaths = ["tests"]
